<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="994" viewBox="-40 -40 840 815"><rect x="-40" y="-40" width="840" height="815" fill="#f7f8fa"/><g data-layer="zones"></g><g data-layer="marks"><g data-id="E-1"><g font-size="36" font-family="Inter" font-weight="500" fill="#1c2024" text-anchor="start"><text x="0" y="35.6" xml:space="preserve">Decision record: move the</text><text x="0" y="80.6" xml:space="preserve">nightly export to the new queue</text></g></g><g data-id="E-2"><g font-size="20" font-family="Inter" font-weight="500" fill="#1c2024" text-anchor="start"><text x="0" y="129.78" xml:space="preserve">Context. The nightly export has failed four times this month</text><text x="0" y="154.78" xml:space="preserve">because the old queue drops jobs larger than 64 MB. The</text><text x="0" y="179.78" xml:space="preserve">new queue streams in chunks, keeps a dead-letter topic,</text><text x="0" y="204.78" xml:space="preserve">and already runs the invoice pipeline without incident since</text><text x="0" y="229.78" xml:space="preserve">July. Moving the export costs about two days of work and</text><text x="0" y="254.78" xml:space="preserve">removes the manual re-run that on-call does every Monday.</text></g></g><g data-id="E-3"><g font-size="20" font-family="Inter" font-weight="500" fill="#1c2024" text-anchor="start"><text x="0" y="319.78" xml:space="preserve">Owner:</text><text x="0" y="344.78" xml:space="preserve">platform</text><text x="0" y="369.78" xml:space="preserve">team.</text><text x="0" y="394.78" xml:space="preserve">Reviewers:</text><text x="0" y="419.78" xml:space="preserve">data,</text><text x="0" y="444.78" xml:space="preserve">finance.</text></g></g><g data-id="E-4"><g font-size="20" font-family="Inter" font-weight="500" fill="#1c2024" text-anchor="start"><text x="150" y="319.78" xml:space="preserve">Options</text><text x="150" y="344.78" xml:space="preserve">- keep the old queue</text><text x="150" y="369.78" xml:space="preserve">and raise the limit</text><text x="150" y="394.78" xml:space="preserve">- move to the new</text><text x="150" y="419.78" xml:space="preserve">queue</text><text x="150" y="444.78" xml:space="preserve"></text><text x="150" y="469.78" xml:space="preserve">Chosen: move to the</text><text x="150" y="494.78" xml:space="preserve">new queue</text></g></g><g data-id="E-5"><g font-size="20" font-family="Inter" font-weight="500" fill="#1c2024" text-anchor="start"><text x="410" y="319.78" xml:space="preserve">Rollout</text><text x="410" y="344.78" xml:space="preserve">    step 1: dual-write for a week</text><text x="410" y="369.78" xml:space="preserve">    step 2: compare row counts daily</text><text x="410" y="394.78" xml:space="preserve">    step 3: switch the reader</text></g></g><g data-id="E-6"><g font-size="20" font-family="Inter" font-weight="500" fill="#1c2024" text-anchor="start"><text x="0" y="529.78" xml:space="preserve">Runbook:</text><text x="0" y="554.78" xml:space="preserve">/srv/runbooks/data-platform/exports/nightly-export-to-</text><text x="0" y="579.78" xml:space="preserve">streaming-queue-migration.md</text></g></g><g data-id="E-7"><g font-size="20" font-family="Geist Mono" font-weight="500" fill="#1c2024" text-anchor="start"><text x="0" y="644.6" xml:space="preserve">queue.publish(topic=&quot;exports.nightly&quot;,</text><text x="0" y="669.6" xml:space="preserve">chunk_mb=8, dead_letter=&quot;exports.dlq&quot;)</text></g></g><g data-id="E-8"><g font-size="16" font-family="Inter" font-weight="500" fill="#1c2024" text-anchor="start"><text x="0" y="730.82" xml:space="preserve">Approved by the operator on 2026-09-27</text></g></g></g><g data-layer="labels"></g><g data-layer="overlays"></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="734" viewBox="-40 -40 1040 745"><rect x="-40" y="-40" width="1040" height="745" fill="#f7f8fa"/><g data-layer="zones"></g><g data-layer="marks"><g data-id="E-1"><rect x="0" y="0" width="280" height="80" rx="8" fill="#ffffff" stroke="#80858f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g font-size="16" font-family="Inter" font-weight="500" fill="#1c2024" text-anchor="middle"><text x="140" y="35.82" xml:space="preserve">Small print: read the retention</text><text x="140" y="55.82" xml:space="preserve">policy before exporting</text></g></g><g data-id="E-2"><rect x="320" y="0" width="300" height="120" rx="8" fill="#ffffff" stroke="#80858f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g font-size="36" font-family="Inter" font-weight="500" fill="#1c2024" text-anchor="middle"><text x="470" y="50.6" xml:space="preserve">Quarterly</text><text x="470" y="95.6" xml:space="preserve">revenue target</text></g></g><g data-id="E-3"><rect x="660" y="0" width="160" height="80" rx="8" fill="#ffffff" stroke="#80858f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g font-size="36" font-family="Inter" font-weight="500" fill="#1c2024" text-anchor="middle"><text x="740" y="53.1" xml:space="preserve">Deploy</text></g></g><g data-id="E-4"><ellipse cx="120" cy="180" rx="120" ry="60" fill="#ffffff" stroke="#80858f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g font-size="16" font-family="Inter" font-weight="500" fill="#1c2024" text-anchor="middle"><text x="120" y="165.82" xml:space="preserve">optional step, skip</text><text x="120" y="185.82" xml:space="preserve">when the cache is</text><text x="120" y="205.82" xml:space="preserve">warm</text></g></g><g data-id="E-5"><ellipse cx="450" cy="210" rx="170" ry="90" fill="#ffffff" stroke="#80858f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g font-size="36" font-family="Inter" font-weight="500" fill="#1c2024" text-anchor="middle"><text x="450" y="223.1" xml:space="preserve">Launch day</text></g></g><g data-id="E-6"><polygon points="810,120 960,210 810,300 660,210" fill="#ffffff" stroke="#80858f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g font-size="36" font-family="Inter" font-weight="500" fill="#1c2024" text-anchor="middle"><text x="810" y="223.1" xml:space="preserve">Ship it?</text></g></g><g data-id="E-7"><rect x="0" y="280" width="180" height="120" rx="4" fill="#fff0a0" stroke="#9e8000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g font-size="18" font-family="Inter" font-weight="500" fill="#4a3b05" text-anchor="middle"><text x="90" y="324.05" xml:space="preserve">Big decision:</text><text x="90" y="346.55" xml:space="preserve">move the launch</text><text x="90" y="369.05" xml:space="preserve">to November</text></g></g><g data-id="E-8"><rect x="220" y="320" width="300" height="260" rx="8" fill="#ffffff" stroke="#80858f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g font-size="36" font-family="Geist Mono" font-weight="500" fill="#1c2024" text-anchor="middle"><text x="370" y="372.78" xml:space="preserve">SELECT</text><text x="370" y="417.78" xml:space="preserve">count(*)</text><text x="370" y="462.78" xml:space="preserve">FROM orders</text><text x="370" y="507.78" xml:space="preserve">WHERE status</text><text x="370" y="552.78" xml:space="preserve">= 'paid';</text></g></g><g data-id="E-9"><rect x="560" y="320" width="280" height="100" rx="8" fill="#ffffff" stroke="#80858f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g font-size="16" font-family="Geist Mono" font-weight="500" fill="#1c2024" text-anchor="middle"><text x="700" y="355.68" xml:space="preserve">export</text><text x="700" y="375.68" xml:space="preserve">HERDR_SYNAPSE_RESVG=/opt/</text><text x="700" y="395.68" xml:space="preserve">homebrew/bin/resvg</text></g></g><g data-id="E-10"><g font-size="36" font-family="Inter" font-weight="500" fill="#1c2024" text-anchor="start"><text x="0" y="475.6" xml:space="preserve">Everything</text><text x="0" y="520.6" xml:space="preserve">on this</text><text x="0" y="565.6" xml:space="preserve">board</text><text x="0" y="610.6" xml:space="preserve">must stay</text><text x="0" y="655.6" xml:space="preserve">readable</text></g></g><g data-id="E-11"><g font-size="16" font-family="Inter" font-weight="500" fill="#1c2024" text-anchor="start"><text x="240" y="615.82" xml:space="preserve">Footnote: numbers are preliminary and exclude</text><text x="240" y="635.82" xml:space="preserve">refunds issued after the 25th of the month.</text></g></g></g><g data-layer="labels"></g><g data-layer="overlays"></g></svg>

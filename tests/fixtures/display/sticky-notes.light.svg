<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="677" viewBox="-40 -40 1180 780"><rect x="-40" y="-40" width="1180" height="780" fill="#f7f8fa"/><g data-layer="zones"><g data-id="E-1"><rect x="0" y="0" width="1100" height="700" rx="16" fill="#f0f1f4" stroke="#d9dce1" stroke-width="1.73" stroke-linecap="round" stroke-linejoin="round"/><g font-size="16" font-family="Inter" font-weight="600" fill="#1c2024" text-anchor="start"><text x="20" y="23.82" xml:space="preserve">Customer interview findings, week 38</text></g></g></g><g data-layer="marks"><g data-id="E-2"><rect x="40" y="60" width="280" height="120" rx="4" fill="#fff0a0" stroke="#9e8000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g font-size="14" font-family="Inter" font-weight="500" fill="#4a3b05" text-anchor="middle"><text x="180" y="98.84" xml:space="preserve">Onboarding</text><text x="180" y="116.34" xml:space="preserve">- 7 of 9 users skipped the tour</text><text x="180" y="133.84" xml:space="preserve">- 4 could not find the invite button</text><text x="180" y="151.34" xml:space="preserve">- 2 asked for SSO on day one</text></g></g><g data-id="E-3"><rect x="360" y="60" width="280" height="140" rx="4" fill="#a5d8ff" stroke="#9e8000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g font-size="14" font-family="Inter" font-weight="500" fill="#4a3b05" text-anchor="middle"><text x="500" y="91.34" xml:space="preserve">Pricing page is confusing: people</text><text x="500" y="108.84" xml:space="preserve">compare the Team plan with the</text><text x="500" y="126.34" xml:space="preserve">Business plan and cannot tell which</text><text x="500" y="143.84" xml:space="preserve">one includes audit logs, so they</text><text x="500" y="161.34" xml:space="preserve">open a support ticket instead of</text><text x="500" y="178.84" xml:space="preserve">upgrading.</text></g></g><g data-id="E-4"><rect x="680" y="60" width="180" height="120" rx="4" fill="#b2f2bb" stroke="#9e8000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g font-size="14" font-family="Inter" font-weight="500" fill="#4a3b05" text-anchor="middle"><text x="770" y="90.09" xml:space="preserve">Quote:</text><text x="770" y="107.59" xml:space="preserve">&quot;I just want to see</text><text x="770" y="125.09" xml:space="preserve">what my team did</text><text x="770" y="142.59" xml:space="preserve">yesterday without</text><text x="770" y="160.09" xml:space="preserve">opening five tabs.&quot;</text></g></g><g data-id="E-5"><rect x="40" y="220" width="260" height="120" rx="4" fill="#ffc9c9" stroke="#9e8000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g font-size="14" font-family="Inter" font-weight="500" fill="#4a3b05" text-anchor="middle"><text x="170" y="250.09" xml:space="preserve">Bug reported twice:</text><text x="170" y="267.59" xml:space="preserve">https://support.example.com/</text><text x="170" y="285.09" xml:space="preserve">tickets/2026/09/38/export-fails-</text><text x="170" y="302.59" xml:space="preserve">when-the-workspace-name-</text><text x="170" y="320.09" xml:space="preserve">contains-an-apostrophe</text></g></g><g data-id="E-6"><rect x="340" y="220" width="180" height="120" rx="4" fill="#fcc2d7" stroke="#9e8000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g font-size="14" font-family="Inter" font-weight="500" fill="#4a3b05" text-anchor="middle"><text x="430" y="267.59" xml:space="preserve">Internationalization</text><text x="430" y="285.09" xml:space="preserve">localisation</text><text x="430" y="302.59" xml:space="preserve">right-to-left layouts</text></g></g><g data-id="E-7"><rect x="560" y="220" width="180" height="120" rx="4" fill="#ffec99" stroke="#9e8000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g font-size="20" font-family="Inter" font-weight="500" fill="#4a3b05" text-anchor="middle"><text x="650" y="287.28" xml:space="preserve">Why?</text></g></g><g data-id="E-8"><rect x="40" y="380" width="260" height="180" rx="4" fill="#fff0a0" stroke="#9e8000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g font-size="14" font-family="Inter" font-weight="500" fill="#4a3b05" text-anchor="middle"><text x="170" y="413.84" xml:space="preserve">Next steps</text><text x="170" y="431.34" xml:space="preserve"></text><text x="170" y="448.84" xml:space="preserve">1. Rewrite the tour as three short</text><text x="170" y="466.34" xml:space="preserve">tips</text><text x="170" y="483.84" xml:space="preserve">2. Add an audit-log row to the</text><text x="170" y="501.34" xml:space="preserve">pricing table</text><text x="170" y="518.84" xml:space="preserve">3. Fix the apostrophe export bug</text><text x="170" y="536.34" xml:space="preserve">before the October release</text></g></g><g data-id="E-9"><rect x="340" y="380" width="280" height="120" rx="4" fill="#99e9f2" stroke="#9e8000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g font-size="14" font-family="Inter" font-weight="500" fill="#4a3b05" text-anchor="middle"><text x="480" y="410.09" xml:space="preserve">Owner: research team (Dana, Luis,</text><text x="480" y="427.59" xml:space="preserve">Mei)</text><text x="480" y="445.09" xml:space="preserve">Due: Friday 2026-10-02</text><text x="480" y="462.59" xml:space="preserve">Status: waiting on two more</text><text x="480" y="480.09" xml:space="preserve">interviews</text></g></g></g><g data-layer="labels"></g><g data-layer="overlays"></g></svg>

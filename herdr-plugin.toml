id = "herdr-team"
name = "Herdr Team"
version = "0.1.0"
min_herdr_version = "0.8.2"
description = "Teams of agents in one Herdr session: roster, charter, shared board, idle-gated nudges"
platforms = ["macos", "linux"]

[[startup]]
command = ["./bin/herdr-team", "daemon", "start"]

[[actions]]
id = "team-up"
title = "Team up: pick agents"
contexts = ["global"]
command = ["./bin/herdr-team", "ui", "picker"]

[[actions]]
id = "compose"
title = "Post to the team board"
contexts = ["pane"]
command = ["./bin/herdr-team", "ui", "compose"]

[[actions]]
id = "console"
title = "Open the team console"
contexts = ["global"]
command = ["./bin/herdr-team", "ui", "console"]

[[actions]]
id = "who"
title = "Who is on the team"
contexts = ["global"]
command = ["./bin/herdr-team", "ui", "who"]

[[actions]]
id = "toggle-view"
title = "Toggle the team Agents view"
contexts = ["global"]
command = ["./bin/herdr-team", "view", "toggle"]

[[actions]]
id = "daemon-start"
title = "Start the team notifier"
contexts = ["global"]
command = ["./bin/herdr-team", "daemon", "start"]

[[events]]
on = "pane.agent_detected"
command = ["./bin/hook", "agent_detected"]

[[events]]
on = "pane.closed"
command = ["./bin/hook", "pane_closed"]

[[events]]
on = "pane.exited"
command = ["./bin/hook", "pane_exited"]

[[panes]]
id = "console"
title = "Team console"
placement = "split"
command = ["sh", "console.sh"]

[[panes]]
id = "compose"
title = "Post"
placement = "popup"
width = "80%"
height = 12
command = ["./bin/herdr-team", "compose"]

[[panes]]
id = "picker"
title = "Team up"
placement = "popup"
width = "70%"
height = 24
command = ["./bin/herdr-team", "picker"]

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: unittest (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the suite
        run: python -m unittest discover -s tests
      - name: Launcher and manifest sanity
        run: |
          sh -n bin/herdr-synapse bin/hook bin/herdr-synapse-sandbox
          ./bin/herdr-synapse --version
          ./bin/herdr-synapse --skill | head -n 3

name: ci

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pi-extension:
    name: Pi extension contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - run: bun test tests/pi_extension.test.ts

  test:
    name: unittest (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run the suite
        run: python -m unittest discover -s tests
      - name: Launcher and manifest sanity
        run: |
          sh -n bin/herdr-synapse bin/hook bin/herdr-synapse-sandbox console.sh
          ./bin/herdr-synapse --version
          ./bin/herdr-synapse --skill | head -n 3
          python -m herdr_team.reference_docs --check
